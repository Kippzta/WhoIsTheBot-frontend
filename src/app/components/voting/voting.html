<h1>Rösta</h1>
<h2>Vem tror du är boten?</h2>

@if (myVote() === null) {

    <p class="hint">Välj ett mål. Du kan bara rösta en gång.</p>

    <div class="targets">
        @for (alias of voteableAliases(); track alias) {
            <button type="button" class="target" (click)="onVote(alias)">
                <span class="target-icon">◎</span>
                {{ alias }}
            </button>
        }
    </div>

} @else {

    <div class="vote-locked">
        <p class="locked-label">RÖST LÅST</p>
        <p class="locked-alias">{{ myVote() }}</p>
        <p class="waiting">Väntar på de andra<span class="dots"></span></p>
    </div>
}
