<h1>Välkommen till chatten!</h1>
<p>Ditt alias: {{ myAlias() }}</p>

@if (starterQuestion()) {

    <h2> {{ starterQuestion() }}</h2>

} @else {

    <h2>Laddar in fråga</h2>
}
<ul>
    @for (message of chatMessages(); track $index) {

    <li>
        <strong>{{ message.alias }}:</strong> {{ message.text }}
    </li>

    }
</ul>

<form [formGroup]="chatRoomForm" (ngSubmit)="onSendMessage()">

    <input type="text" formControlName="text" [maxlength]="MAX_TEXT_LENGTH" placeholder="Skriv här...">
    <button type="submit" [disabled]="chatRoomForm.invalid">Skicka</button>

</form>
