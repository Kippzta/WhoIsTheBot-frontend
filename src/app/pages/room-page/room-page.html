@if (gameRoom(); as room) {

    @switch (room.gameStatus) {

        @case ('WAITING') { <app-lobby></app-lobby> }

        @case ('CHATTING') { 

            <h2>Spelet har startat!</h2> 
            <p>Du är: {{ myAlias() }}</p>

             <app-chat> </app-chat>
        }
    }

} @else {
<div class="waiting">
    <p>Ansluter...</p>
</div>
}
