@if (gameRoom(); as room) {

    @switch (room.gameStatus) {

        @case ('WAITING') { <app-lobby></app-lobby> }

        @case ('CHATTING') { 

             <app-chat> </app-chat>
        }

        @case ('VOTING') 
        {
            <h1>RÖSTA</h1>
            <h2>Vem är botten?</h2>
        }
    }

} @else {
<div class="waiting">
    <p>Ansluter...</p>
</div>
}
