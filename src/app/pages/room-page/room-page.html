@if (gameRoom(); as room) {

    @switch (room.gameStatus) {

        @case ('WAITING') { 
            
            <app-lobby></app-lobby> }

        @case ('CHATTING') { 

             <app-chat> </app-chat>
        }

        @case ('VOTING') 
        {
           <app-voting> </app-voting>
        }

        @case ('FINISHED') {

            <app-result></app-result>
        }
    }

} @else {
<div class="waiting">
    <p>Ansluter...</p>
</div>
}
